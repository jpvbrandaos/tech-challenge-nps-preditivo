[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "src"
version = "0.0.1"
description = "Previs\u00e3o de detratores de NPS a partir de dados operacionais de e-commerce"
authors = [
  { name = "Jo\u00e3o Pedro Brand\u00e3o" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.13.0"


[tool.ruff]
line-length = 99
src = ["src"]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py", "notebooks/**/*.ipynb"]

[tool.ruff.lint]
# Além do padrão: ordem dos imports, erros prováveis, sintaxe atual e docstrings
extend-select = ["I", "B", "UP", "D1"]

[tool.ruff.lint.per-file-ignores]
# Testes e notebooks dispensam docstrings: o nome do teste e o texto do notebook explicam o código
"tests/**" = ["D1"]
"notebooks/**" = ["D1"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true
